name: Neuronto ARD Registry
description: Agentic Resource Discovery (ARD) index. One search covers this index and every other public ARD registry,
  and results carry the tools each MCP server actually exposes, read from its own tools/list. The index holds 15,412
  resources from 6,926 publishers, 14,522 verified to respond, and answers over REST, MCP and A2A with no key and no
  signup.
